# Local PostgreSQL for the "postgres" profile:
#   docker compose up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timedeposits
      POSTGRES_USER: timedeposit
      POSTGRES_PASSWORD: timedeposit
    ports:
      - "5432:5432"

