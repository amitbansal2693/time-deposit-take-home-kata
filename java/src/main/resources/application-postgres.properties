# =============================================================================
# Profile "postgres". Activate with: --spring.profiles.active=postgres
# Connection details come from environment variables (defaults match compose.yaml).
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/timedeposits}
spring.datasource.username=${DB_USERNAME:timedeposit}
spring.datasource.password=${DB_PASSWORD:timedeposit}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# schema.sql uses IF NOT EXISTS and data.sql is idempotent, so restarts are safe.
# Set DB_INIT_MODE=never when the schema is managed externally (e.g. Flyway).
spring.sql.init.mode=${DB_INIT_MODE:always}

