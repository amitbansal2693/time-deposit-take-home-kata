# =============================================================================
# Shared settings for every environment.
# Environment-specific settings live in application-<profile>.properties:
#   local    -> in-memory H2 (default)        application-local.properties
#   postgres -> PostgreSQL                    application-postgres.properties
# Values written as ${ENV_VAR:default} can be overridden with environment variables.
# =============================================================================

spring.application.name=time-deposit-kata
spring.profiles.default=local

# --- JPA / Hibernate ---------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
# Keep the exact camelCase table/column names from the requirements.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# JDBC statements grouped per database round trip during the balance update.
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_updates=true

# --- Schema and seed data (schema.sql / data.sql) ----------------------------
spring.sql.init.mode=always

# --- Transactions ------------------------------------------------------------
# Upper bound for any transaction, including the full balance update.
spring.transaction.default-timeout=${TX_TIMEOUT:300s}

# --- Errors: RFC 7807 problem JSON -------------------------------------------
spring.mvc.problemdetails.enabled=true

# --- Balance update ----------------------------------------------------------
# Deposits read and written per batch.
time-deposit.update-batch-size=${UPDATE_BATCH_SIZE:500}
# How long a PUT waits for another running update before returning 409.
time-deposit.update.lock-timeout=${UPDATE_LOCK_TIMEOUT:10s}

# --- GET API -----------------------------------------------------------------
# Page size when only afterId is given, and the maximum allowed limit.
time-deposit.api.default-page-size=100
time-deposit.api.max-page-size=1000
# Cache-Control max-age for clients; 0s = always revalidate using the ETag.
time-deposit.api.cache-max-age=${API_CACHE_MAX_AGE:0s}
# Longest accepted Idempotency-Key header (1-100; 100 is the database column size).
time-deposit.api.max-idempotency-key-length=${IDEMPOTENCY_KEY_MAX_LENGTH:100}
# Field scopes (basic, default, full) for GET ?scope=...; see dto/time-deposit-response-scopes.xml.
time-deposit.api.response-scopes-file=classpath:dto/time-deposit-response-scopes.xml

# --- Caching -----------------------------------------------------------------
# Server-side GET cache, evicted on every balance update.
time-deposit.cache.ttl=${CACHE_TTL:30s}
# How long the last successful response may be served as a stale fallback.
time-deposit.cache.last-known-ttl=${CACHE_LAST_KNOWN_TTL:10m}
time-deposit.cache.max-entries=100

# --- Rate limiting (per instance) --------------------------------------------
resilience4j.ratelimiter.instances.timeDepositsRead.limit-for-period=${RATE_LIMIT_READ_PER_SECOND:50}
resilience4j.ratelimiter.instances.timeDepositsRead.limit-refresh-period=1s
resilience4j.ratelimiter.instances.timeDepositsRead.timeout-duration=0s
resilience4j.ratelimiter.instances.timeDepositsUpdate.limit-for-period=${RATE_LIMIT_UPDATE_PER_MINUTE:5}
resilience4j.ratelimiter.instances.timeDepositsUpdate.limit-refresh-period=1m
resilience4j.ratelimiter.instances.timeDepositsUpdate.timeout-duration=0s

# --- Circuit breaker for GET (only database failures count) ------------------
resilience4j.circuitbreaker.instances.timeDepositsRead.sliding-window-size=20
resilience4j.circuitbreaker.instances.timeDepositsRead.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.timeDepositsRead.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.timeDepositsRead.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.timeDepositsRead.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.timeDepositsRead.record-exceptions[0]=org.springframework.dao.DataAccessException
resilience4j.circuitbreaker.instances.timeDepositsRead.record-exceptions[1]=org.springframework.transaction.TransactionException

# --- Logging -----------------------------------------------------------------
# INFO by default; e.g. LOG_LEVEL_APP=DEBUG shows each update batch.
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.ikigaidigital=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
# Set LOG_FILE_NAME to also write to a file (console only by default).
logging.file.name=${LOG_FILE_NAME:}
# Adds the correlation id to every log line.
logging.pattern.level=%5p [%X{correlationId:-}]
# One log line per request: method, path, status, duration.
time-deposit.logging.request-logging-enabled=${REQUEST_LOGGING_ENABLED:true}

# --- Swagger -----------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html

