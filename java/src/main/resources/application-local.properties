# =============================================================================
# Profile "local" (default): in-memory H2, recreated and seeded on every start.
# MODE=PostgreSQL keeps SQL behavior close to the postgres profile.
# =============================================================================
spring.datasource.url=jdbc:h2:mem:timedepositdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Rate limits for local development (override application.properties).
# Looser than the shared values so manual testing and demos don't hit 429.
resilience4j.ratelimiter.instances.timeDepositsRead.limit-for-period=${RATE_LIMIT_READ_PER_SECOND:200}
resilience4j.ratelimiter.instances.timeDepositsUpdate.limit-for-period=${RATE_LIMIT_UPDATE_PER_MINUTE:100}
